<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp — Contatti 233° — rev.2</title>
<style>
  :root { --blu:#005CA9; --verde:#25D366; --grigio:#bbb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Arial',sans-serif; background:#f0f2f5; padding:1rem; }
  header { background:var(--blu); color:#fff; padding:1rem 1.4rem; border-radius:10px; margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  header h1 { font-size:1.05rem; }
  .header-right { display:flex; align-items:center; gap:.8rem; font-size:.82rem; opacity:.85; }
  .rev-tag { font-size:.62rem; opacity:.5; }
  .progress { background:#fff; border-radius:8px; padding:.5rem 1rem; margin-bottom:.8rem; font-size:.85rem; color:var(--blu); font-weight:700; text-align:center; }
  .loading { text-align:center; padding:2rem; color:#888; font-size:.9rem; }
  .scuola-label { background:#fff; color:var(--blu); font-weight:bold; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; padding:.5rem 1rem; border-radius:8px; margin:.8rem 0 .4rem; }
  .card { background:#fff; border-radius:10px; padding:.75rem 1rem; margin:.3rem 0; display:flex; align-items:center; justify-content:space-between; gap:1rem; box-shadow:0 1px 3px rgba(0,0,0,.08); transition:opacity .3s; }
  .card.inviato { opacity:.45; }
  .info { flex:1; min-width:0; }
  .nome { font-weight:700; font-size:.95rem; color:#111; }
  .tel { font-size:.78rem; color:#888; margin-top:.1rem; }
  .data-invio { font-size:.7rem; color:var(--verde); margin-top:.15rem; }
  .btn { display:inline-flex; align-items:center; gap:.4rem; background:var(--verde); color:#fff; text-decoration:none; border-radius:8px; padding:.55rem 1rem; font-size:.85rem; font-weight:700; white-space:nowrap; flex-shrink:0; border:none; cursor:pointer; transition:background .2s; }
  .btn.inviato { background:var(--grigio); pointer-events:none; }
  .btn svg { flex:0 0 auto; }
  .errore { background:#fdecea; color:#c0392b; border-radius:8px; padding:.8rem 1rem; margin:.5rem 0; font-size:.88rem; }
</style>
</head>
<body>
<header>
  <h1>📋 Contatti 233° — Invio WhatsApp</h1>
  <div class="header-right">
    <span id="nomeMittenteLabel" style="font-size:.82rem; opacity:.85; cursor:pointer;" onclick="cambiaNome()" title="Clicca per cambiare nome">👤 <span id="nomeMittenteSpan">—</span></span>
    <span id="totLabel">Caricamento…</span>
    <span class="rev-tag">rev.3</span>
  </div>
</header>
<div class="progress" id="progress">Caricamento contatti…</div>
<div id="lista"><div class="loading">⏳ Caricamento in corso…</div></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsD7KImUy2Xa9egcfWmroGzoO1DEaHZwLt4Khocc4DOtAfGmSpPRrYUWufknSeV5fgoQ/exec';

const MSG_TEMPLATE = `Ciao {NOME_ALLIEVO}, grazie per avermi scritto, sono {NOME_MITTENTE} del SILP CGIL. Hai compilato il modulo 😊
Per poterti aiutare con un'analisi precisa sulle tue possibilità mi servono un paio di cose da te.
Intanto la tua posizione in graduatoria, poi dove sei nato e dove risiedi, così teniamo conto anche dei collegamenti aerei treni per andare a casa ogni tanto con facilità. E mi serve lo screenshot della tua lista con le sedi che hai scelto in ordine, così com'è uscita a te.
Se puoi, accanto a ogni sede della tua lista scrivimi anche il numero totale di posti di quella provincia, così da un'occhiata riesco già a farmi un'idea prima ancora di guardare tutto nel dettaglio.
Appena mi mandi questi dati ti rispondo con un quadro chiaro e la situazione alloggiativa.
{NOME_MITTENTE}`;

const KEY_MITTENTE = 'wa233_mittente';

function getNomeMittente(){
  return localStorage.getItem(KEY_MITTENTE) || '';
}

function chiediNomeMittente(){
  const nome = prompt('Come ti chiami? (es. Gianluca)\nIl tuo nome apparirà nei messaggi WhatsApp.');
  if(nome && nome.trim()){
    localStorage.setItem(KEY_MITTENTE, nome.trim());
    return nome.trim();
  }
  return 'SILP CGIL';
}

function normalizzaTel(tel){
  let t = tel.replace(/\s+/g,'').replace(/^\+/,'');
  if(t.startsWith('39')) return t;
  if(t.startsWith('3')) return '39' + t;
  return t;
}

function buildMsg(nomeAllievo) {
  let mittente = getNomeMittente() || chiediNomeMittente();
  return encodeURIComponent(
    MSG_TEMPLATE
      .replace(/{NOME_ALLIEVO}/g, nomeAllievo || '')
      .replace(/{NOME_MITTENTE}/g, mittente)
  );
}
const WA_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

let contatti = [];

function aggiornaProgress(){
  const inviati = contatti.filter(c => c.inviato).length;
  document.getElementById('progress').textContent = inviati + ' / ' + contatti.length + ' inviati';
  document.getElementById('totLabel').textContent = contatti.length + ' contatti';
}

function segna(tel, riga, btnEl, cardEl){
  // Prima apre WA, poi segna sul backend
  fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({ action:'setInviato', riga: riga })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.ok){
      const now = new Date().toLocaleString('it-IT');
      const c = contatti.find(function(x){ return x.tel === tel; });
      if(c){ c.inviato = now; }
      btnEl.classList.add('inviato');
      btnEl.innerHTML = '✓ Inviato';
      cardEl.classList.add('inviato');
      const dataEl = cardEl.querySelector('.data-invio');
      if(dataEl) dataEl.textContent = 'Inviato il ' + now;
      aggiornaProgress();
    }
  }).catch(function(){});
}

function render(){
  const lista = document.getElementById('lista');
  if(!contatti.length){
    lista.innerHTML = '<div class="errore">Nessun contatto trovato nel foglio.</div>';
    return;
  }
  let html = '';
  let scuolaCorrente = null;
  contatti.forEach(function(c){
    if(c.scuola !== scuolaCorrente){
      scuolaCorrente = c.scuola;
      html += '<div class="scuola-label">' + c.scuola + '</div>';
    }
    const nome = (c.cognome + ' ' + c.nome).trim();
    const tel = c.tel;
    const waLink = 'https://wa.me/' + tel + '?text=' + buildMsg(c.nome);
    const isInviato = !!c.inviato;
    html += '<div class="card' + (isInviato ? ' inviato' : '') + '" id="card_' + tel + '">' +
      '<div class="info">' +
        '<div class="nome">' + nome + '</div>' +
        '<div class="tel">+' + tel + '</div>' +
        (isInviato ? '<div class="data-invio">Inviato il ' + c.inviato + '</div>' : '<div class="data-invio"></div>') +
      '</div>' +
      '<a class="btn' + (isInviato ? ' inviato' : '') + '" id="btn_' + tel + '" ' +
        'href="' + waLink + '" target="_blank" ' +
        'onclick="segna(\'' + tel + '\',' + c.riga + ',this,document.getElementById(\'card_' + tel + '\'))">' +
        (isInviato ? '✓ Inviato' : WA_SVG + ' Invia WA') +
      '</a>' +
    '</div>';
  });
  lista.innerHTML = html;
  aggiornaProgress();
}

function cambiaNome(){
  localStorage.removeItem(KEY_MITTENTE);
  const nuovo = chiediNomeMittente();
  document.getElementById('nomeMittenteSpan').textContent = nuovo;
}

// Carica i contatti dal GAS
fetch(GAS_URL + '?action=getContatti')
  .then(function(r){ return r.json(); })
  .then(function(data){
    // Chiedi il nome mittente se non è già salvato
    let mittente = getNomeMittente();
    if(!mittente){ mittente = chiediNomeMittente(); }
    document.getElementById('nomeMittenteSpan').textContent = mittente;
    if(data.contatti){
      // Deduplica per cellulare, tieni la prima occorrenza
      const visti = {};
      const unici = [];
      data.contatti.forEach(function(c){
        const tel = normalizzaTel(c.tel);
        if(tel && !visti[tel]){
          visti[tel] = true;
          c.tel = tel;
          unici.push(c);
        }
      });
      // Ordina per scuola poi cognome
      contatti = unici.sort(function(a,b){
        return a.scuola.localeCompare(b.scuola) || a.cognome.localeCompare(b.cognome);
      });
      render();
    } else {
      document.getElementById('lista').innerHTML = '<div class="errore">Errore nel caricamento: ' + JSON.stringify(data) + '</div>';
    }
  })
  .catch(function(err){
    document.getElementById('lista').innerHTML = '<div class="errore">Errore di connessione al backend.</div>';
  });
</script>
</body>
</html>
